[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sisilji-traffic"
version = "0.1.0"
description = "Reproducible synthetic SUMO corridor and constrained signal recommendations"
requires-python = ">=3.10"
dependencies = ["eclipse-sumo==1.28.0", "traci==1.28.0", "sumolib==1.28.0", "sumo-data==1.28.0"]

[project.scripts]
sisilji-traffic = "sisilji_traffic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
